name: Fetch Bing Wallpaper
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Bing
        run: |
          python3 - <<END
          import requests, json
          res = requests.get("https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN")
          data = res.json()
          img = data["images"][0]
          out = {
            "title": img["title"],
            "copyright": img["copyright"],
            "url": "https://cn.bing.com" + img["url"],
            "copyrightlink": img["copyrightlink"]
          }
          with open("bing.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          END
      - name: Commit
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "bot@github.com"
          git add bing.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update bing wallpaper"
          git push
