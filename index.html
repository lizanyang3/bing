<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bing 每日壁纸</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
#bg{
  width:100%;
  height:100%;
  object-fit:cover;
}
.info{
  position:fixed;
  bottom:20px;
  left:20px;
  color:#fff;
  background:rgba(0,0,0,0.45);
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  max-width:calc(100% - 240px);
}
.info a{
  color:#8cf;
  text-decoration:none;
}
.btn-group{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  gap:10px;
}
button{
  color:#fff;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.3);
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}
button:hover{
  background:rgba(0,0,0,0.75);
}
</style>
</head>
<body>
<img id="bg" alt="Bing Wallpaper">

<div class="info">
  <div id="title"></div>
  <div id="copyright"></div>
  <div id="resolution" style="margin-top:6px;font-size:12px;color:#ccc"></div>
  <div style="margin-top:6px;font-size:12px;color:#ccc">
    ⚠️ 图片来源 Bing，版权归原作者所有，仅作技术演示，请勿商用
  </div>
</div>
<div class="btn-group">
  <button id="toggle4k">切换画质</button>
  <button id="downloadBtn">下载图片</button>
</div>

<script>
let currentData = null;
let isHD = true;
let nowImgUrl = "";

function setImage(url) {
  nowImgUrl = url;
  document.getElementById("bg").src = url;
}

async function loadData() {
  const res = await fetch("./bing.json", { cache: "no-store" });
  currentData = await res.json();

  // 默认优先高清UHD
  const hdUrl = currentData.url_uhd || currentData.url_4k;
  if(hdUrl){
    setImage(hdUrl);
    // 高清加载失败自动回退普通
    document.getElementById("bg").onerror = ()=>{
      isHD = false;
      document.getElementById("toggle4k").innerText = "切换高清";
      setImage(currentData.url);
    }
  }else{
    isHD = false;
    setImage(currentData.url);
    document.getElementById("toggle4k").style.display = "none";
  }

  document.getElementById("title").innerText = currentData.title;
  document.getElementById("copyright").innerHTML =
    `<a href="${currentData.copyrightlink}" target="_blank">${currentData.copyright}</a>`;

  if (currentData.resolution) {
    document.getElementById("resolution").innerText =
      `当前尺寸：${currentData.resolution}`;
  }
}

document.getElementById("toggle4k").addEventListener("click", function () {
  if (!currentData) return;
  isHD = !isHD;
  if (isHD) {
    const hdUrl = currentData.url_uhd || currentData.url_4k;
    this.innerText = "切换普通";
    setImage(hdUrl);
    document.getElementById("bg").onerror = () => {
      isHD = false;
      this.innerText = "切换高清";
      setImage(currentData.url);
      alert("这张图没有开放高清原图，已回退普通画质");
    };
  } else {
    this.innerText = "切换高清";
    setImage(currentData.url);
    document.getElementById("bg").onerror = null;
  }
});

// 下载自定义文件名
document.getElementById("downloadBtn").addEventListener("click",async ()=>{
  if(!nowImgUrl || !currentData) return;
  let name = currentData.title.replace(/[\/\\:*?"<>|]/g,"_");
  let resStr = currentData.resolution || "";
  let saveName = `必应壁纸_${name}_${resStr}.jpg`;

  try{
    const a = document.createElement("a");
    a.href = nowImgUrl;
    a.download = saveName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    alert("受必应防盗链限制，无法直接下载，请右键图片另存为");
  }
});

loadData().catch(e => console.error("加载失败", e));
</script>
</body>
</html>
