<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bing 每日壁纸</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bottom-safe: env(safe-area-inset-bottom, 0px);
  --overlay: transparent;
}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
#bg{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .6s ease;
  cursor:zoom-in;
}
#bg.visible{
  opacity:1;
}
.progress{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:3px;
  background:rgba(255,255,255,.12);
  z-index:20;
}
.progress-bar{
  width:0%;
  height:100%;
  background:#fff;
  transition:width .2s linear;
}
.info{
  position:fixed;
  bottom:116px;
  left:20px;
  right:20px;
  color:#fff;
  background:transparent;
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  max-width:calc(100% - 280px);
}
.greeting{
  font-size:13px;
  color:#ddd;
  margin-bottom:6px;
}
.meta-row{
  margin-top:6px;
  font-size:12px;
  color:#ccc;
}
.info a{
  color:#8cf;
  text-decoration:none;
}
.btn-group{
  position:fixed;
  bottom:calc(18px + var(--bottom-safe));
  right:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
button{
  color:#fff;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.3);
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}
button:hover{
  background:rgba(0,0,0,0.75);
}
button.active{
  background:rgba(255,255,255,.85);
  color:#111;
}
.history{
  position:fixed;
  bottom:calc(18px + var(--bottom-safe));
  left:20px;
  display:flex;
  gap:10px;
  max-width:calc(100% - 360px);
  overflow-x:auto;
  padding:4px;
  scrollbar-width:thin;
}
.history-item{
  width:120px;
  height:68px;
  border-radius:8px;
  overflow:hidden;
  cursor:pointer;
  border:2px solid transparent;
  background:rgba(255,255,255,0.12);
  flex:0 0 auto;
}
.history-item.active{
  border-color:#fff;
}
.history-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

@media (max-width: 720px){
  #bg{
    object-fit:contain;
  }
  .info{
    left:14px;
    right:14px;
    bottom:166px;
    max-width:none;
    padding:10px 12px;
    font-size:13px;
  }
  .history{
    left:14px;
    right:14px;
    bottom:76px;
    max-width:none;
    gap:8px;
  }
  .history-item{
    width:96px;
    height:56px;
  }
  .btn-group{
    left:14px;
    right:14px;
    bottom:calc(14px + var(--bottom-safe));
    justify-content:space-between;
    gap:8px;
    flex-wrap:nowrap;
  }
  .btn-group button{
    flex:1;
    padding:10px 8px;
    font-size:13px;
    white-space:nowrap;
  }
}

@media (max-width: 380px){
  .info{
    bottom:158px;
  }
  .history{
    bottom:72px;
  }
  .history-item{
    width:84px;
    height:48px;
  }
  .btn-group button{
    font-size:12px;
    padding:9px 6px;
  }
}
</style>
</head>
<body>
<img id="bg" alt="Bing Wallpaper">

<div class="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="info">
  <div class="greeting" id="greeting"></div>
  <div id="title"></div>
  <div id="copyright"></div>
  <div class="meta-row" id="resolution"></div>
  <div class="meta-row" id="photoMeta"></div>
  <div class="meta-row" style="color:#bbb">
    图片来源 Bing，版权归原作者所有，仅作技术演示，请勿商用
  </div>
</div>

<div class="history" id="history"></div>

<div class="btn-group">
  <button id="modeBtn">随机模式</button>
  <button id="autoBtn">暂停轮换</button>
  <button id="toggle4k">切换普通画质</button>
  <button id="downloadBtn">下载图片</button>
</div>

<script>
const ROTATE_INTERVAL = 30000;

let currentData = null;
let wallpaperList = [];
let activeIndex = 0;
let activeWallpaper = null;
let isHD = true;
let nowImgUrl = "";
let currentNaturalSize = "";
let autoTimer = null;
let progressTimer = null;
let progressStart = 0;
let isAutoPlay = true;
let isRandom = false;

const bg = document.getElementById("bg");
const resolutionEl = document.getElementById("resolution");
const photoMetaEl = document.getElementById("photoMeta");
const toggleBtn = document.getElementById("toggle4k");
const autoBtn = document.getElementById("autoBtn");
const modeBtn = document.getElementById("modeBtn");
const historyEl = document.getElementById("history");
const progressBar = document.getElementById("progressBar");

function getGreeting() {
  const hour = new Date().getHours();
  if (hour >= 5 && hour < 11) return "早上好";
  if (hour >= 11 && hour < 14) return "中午好";
  if (hour >= 14 && hour < 18) return "下午好";
  if (hour >= 18 && hour < 23) return "晚上好";
  return "夜深了";
}

function formatDate(enddate) {
  if (!enddate || enddate.length !== 8) return "";
  return `${enddate.slice(0, 4)}-${enddate.slice(4, 6)}-${enddate.slice(6, 8)}`;
}

function extractArtist(copyrightText) {
  if (!copyrightText) return "";
  const match = copyrightText.match(/©\s*(.+?)(?:\)|$)/);
  return match ? match[1].trim() : "";
}

function setResolutionText() {
  if (!activeWallpaper) return;

  if (isHD) {
    resolutionEl.innerText = "当前画质：高清原图 UHD";
  } else {
    resolutionEl.innerText =
      `当前尺寸：${activeWallpaper.resolution || "1920×1080"}`;
  }
}

function updatePhotoMeta() {
  if (!activeWallpaper) return;

  const date = formatDate(activeWallpaper.enddate);
  const artist = extractArtist(activeWallpaper.copyright);
  const parts = [];

  if (date) parts.push(`日期：${date}`);
  if (artist) parts.push(`作者：${artist}`);

  photoMetaEl.innerText = parts.length ? parts.join("　") : "拍摄信息暂未提供";
}

function setImage(wallpaper) {
  activeWallpaper = wallpaper;
  currentNaturalSize = "";

  const hdUrl = wallpaper.url_uhd || wallpaper.url_4k;
  const useHD = Boolean(hdUrl);
  isHD = useHD;

  toggleBtn.style.display = hdUrl ? "inline-block" : "none";
  toggleBtn.innerText = useHD ? "切换普通画质" : "切换高清原图";

  nowImgUrl = useHD ? hdUrl : wallpaper.url;
  bg.classList.remove("visible");
  bg.src = nowImgUrl;
  setResolutionText();
  updatePhotoMeta();
}

function updateInfo() {
  if (!activeWallpaper) return;

  document.getElementById("greeting").innerText = getGreeting();
  document.getElementById("title").innerText = activeWallpaper.title;
  document.getElementById("copyright").innerHTML =
    `<a href="${activeWallpaper.copyrightlink}" target="_blank">${activeWallpaper.copyright}</a>`;
  document.title = activeWallpaper.title || "Bing 每日壁纸";
}

function markActiveThumb() {
  document.querySelectorAll(".history-item").forEach((el, index) => {
    el.classList.toggle("active", index === activeIndex);
  });
}

bg.addEventListener("load", function () {
  bg.classList.add("visible");

  if (bg.naturalWidth && bg.naturalHeight) {
    currentNaturalSize = `${bg.naturalWidth}×${bg.naturalHeight}`;
    resolutionEl.innerText = `当前图片：${currentNaturalSize}`;
  }
});

function renderHistory() {
  historyEl.innerHTML = "";

  wallpaperList.forEach((wallpaper, index) => {
    const item = document.createElement("div");
    item.className = "history-item";
    item.title = wallpaper.title;

    const img = document.createElement("img");
    img.src = wallpaper.thumbnail || wallpaper.url;
    img.alt = wallpaper.title;
    img.loading = "lazy";

    item.appendChild(img);
    item.addEventListener("click", () => {
      activeIndex = index;
      setImage(wallpaper);
      updateInfo();
      markActiveThumb();
      restartAutoTimer();
    });

    historyEl.appendChild(item);
  });

  markActiveThumb();
}

function getNextIndex() {
  if (wallpaperList.length <= 1) return activeIndex;

  if (isRandom) {
    let next;
    do {
      next = Math.floor(Math.random() * wallpaperList.length);
    } while (next === activeIndex);
    return next;
  }

  return activeIndex + 1;
}

function showWallpaper(index) {
  if (wallpaperList.length === 0) return;
  activeIndex = (index + wallpaperList.length) % wallpaperList.length;
  const wallpaper = wallpaperList[activeIndex];

  setImage(wallpaper);
  updateInfo();
  markActiveThumb();
  restartAutoTimer();
}

function showNextWallpaper() {
  showWallpaper(getNextIndex());
}

function showPrevWallpaper() {
  showWallpaper(activeIndex - 1);
}

function updateProgress() {
  if (!isAutoPlay) {
    progressBar.style.width = "0%";
    return;
  }

  const elapsed = Date.now() - progressStart;
  const percent = Math.min(100, (elapsed / ROTATE_INTERVAL) * 100);
  progressBar.style.width = `${percent}%`;
}

function startAutoTimer() {
  stopAutoTimer();
  if (!isAutoPlay) return;

  progressStart = Date.now();
  progressTimer = setInterval(updateProgress, 200);
  autoTimer = setInterval(showNextWallpaper, ROTATE_INTERVAL);
}

function stopAutoTimer() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
  }
  if (progressTimer) {
    clearInterval(progressTimer);
    progressTimer = null;
  }
  progressBar.style.width = "0%";
}

function restartAutoTimer() {
  startAutoTimer();
}

function toggleAutoPlay() {
  isAutoPlay = !isAutoPlay;
  autoBtn.innerText = isAutoPlay ? "暂停轮换" : "开始轮换";

  if (isAutoPlay) {
    startAutoTimer();
  } else {
    stopAutoTimer();
  }
}

function toggleMode() {
  isRandom = !isRandom;
  modeBtn.classList.toggle("active", isRandom);
  modeBtn.innerText = isRandom ? "随机模式" : "顺序模式";
  restartAutoTimer();
}

autoBtn.addEventListener("click", toggleAutoPlay);
modeBtn.addEventListener("click", toggleMode);

async function downloadCurrent() {
  if (!nowImgUrl || !activeWallpaper) return;

  const name = activeWallpaper.title.replace(/[\/\\:*?"<>|]/g, "_");
  const resStr = currentNaturalSize || activeWallpaper.resolution || "";
  const saveName = `必应壁纸_${name}_${resStr}.jpg`;

  try {
    const resp = await fetch(nowImgUrl, {
      mode: "cors",
      cache: "no-store"
    });

    if (!resp.ok) throw new Error("图片读取失败");

    const blob = await resp.blob();
    const objectUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = saveName;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(objectUrl);
  } catch (e) {
    window.open(nowImgUrl, "_blank", "noopener");
    alert("当前环境不能直接保存文件，请在新打开的图片页面右键另存为");
  }
}

document.getElementById("downloadBtn").addEventListener("click", downloadCurrent);

async function toggleFullscreen() {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen?.();
  } else {
    await document.exitFullscreen?.();
  }
}

bg.addEventListener("click", toggleFullscreen);

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input, textarea")) return;

  if (event.key === "ArrowRight") {
    showNextWallpaper();
  } else if (event.key === "ArrowLeft") {
    showPrevWallpaper();
  } else if (event.code === "Space") {
    event.preventDefault();
    toggleAutoPlay();
  } else if (event.key.toLowerCase() === "d") {
    downloadCurrent();
  } else if (event.key.toLowerCase() === "f") {
    toggleFullscreen();
  } else if (event.key.toLowerCase() === "m") {
    toggleMode();
  }
});

async function loadData() {
  const res = await fetch("./bing.json", { cache: "no-store" });
  currentData = await res.json();

  if (currentData.error) {
    resolutionEl.innerText = currentData.error;
    return;
  }

  wallpaperList = [currentData.current, ...(currentData.history || [])];
  activeIndex = 0;

  setImage(wallpaperList[activeIndex]);
  updateInfo();
  renderHistory();
  startAutoTimer();

  bg.onerror = () => {
    if (isHD) {
      isHD = false;
      toggleBtn.innerText = "切换高清原图";
      nowImgUrl = activeWallpaper.url;
      bg.src = nowImgUrl;
      setResolutionText();
    }
  };
}

toggleBtn.addEventListener("click", function () {
  if (!activeWallpaper) return;

  isHD = !isHD;

  if (isHD) {
    const hdUrl = activeWallpaper.url_uhd || activeWallpaper.url_4k;
    this.innerText = "切换普通画质";
    nowImgUrl = hdUrl;
    bg.src = hdUrl;

    bg.onerror = () => {
      isHD = false;
      this.innerText = "切换高清原图";
      nowImgUrl = activeWallpaper.url;
      bg.src = activeWallpaper.url;
      setResolutionText();
      alert("这张图没有开放高清原图，已回退普通画质");
    };
  } else {
    this.innerText = "切换高清原图";
    nowImgUrl = activeWallpaper.url;
    bg.src = activeWallpaper.url;
    bg.onerror = null;
  }

  setResolutionText();
});

loadData().catch(e => console.error("加载失败", e));
</script>
</body>
</html>
