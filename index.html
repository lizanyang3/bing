<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bing 每日壁纸</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
#bg{
  width:100%;
  height:100%;
  object-fit:cover;
}
.info{
  position:fixed;
  bottom:86px;
  left:20px;
  color:#fff;
  background:rgba(0,0,0,0.45);
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  max-width:calc(100% - 240px);
}
.info a{
  color:#8cf;
  text-decoration:none;
}
.btn-group{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  gap:10px;
}
button{
  color:#fff;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.3);
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}
button:hover{
  background:rgba(0,0,0,0.75);
}
.history{
  position:fixed;
  bottom:20px;
  left:20px;
  display:flex;
  gap:10px;
  max-width:calc(100% - 240px);
  overflow-x:auto;
  padding:4px;
}
.history-item{
  width:120px;
  height:68px;
  border-radius:8px;
  overflow:hidden;
  cursor:pointer;
  border:2px solid transparent;
  background:rgba(255,255,255,0.12);
  flex:0 0 auto;
}
.history-item.active{
  border-color:#fff;
}
.history-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
</style>
</head>
<body>
<img id="bg" alt="Bing Wallpaper">

<div class="info">
  <div id="title"></div>
  <div id="copyright"></div>
  <div id="resolution" style="margin-top:6px;font-size:12px;color:#ccc"></div>
  <div style="margin-top:6px;font-size:12px;color:#ccc">
    图片来源 Bing，版权归原作者所有，仅作技术演示，请勿商用
  </div>
</div>

<div class="history" id="history"></div>

<div class="btn-group">
  <button id="toggle4k">切换普通画质</button>
  <button id="downloadBtn">下载图片</button>
</div>

<script>
let currentData = null;
let activeWallpaper = null;
let isHD = true;
let nowImgUrl = "";
let currentNaturalSize = "";

const bg = document.getElementById("bg");
const resolutionEl = document.getElementById("resolution");
const toggleBtn = document.getElementById("toggle4k");
const historyEl = document.getElementById("history");

function setResolutionText() {
  if (!activeWallpaper) return;

  if (isHD) {
    resolutionEl.innerText = "当前画质：高清原图 UHD";
  } else {
    resolutionEl.innerText =
      `当前尺寸：${activeWallpaper.resolution || "1920×1080"}`;
  }
}

function setImage(wallpaper) {
  activeWallpaper = wallpaper;
  currentNaturalSize = "";

  const hdUrl = wallpaper.url_uhd || wallpaper.url_4k;
  const useHD = Boolean(hdUrl);
  isHD = useHD;

  toggleBtn.style.display = hdUrl ? "inline-block" : "none";
  toggleBtn.innerText = useHD ? "切换普通画质" : "切换高清原图";

  nowImgUrl = useHD ? hdUrl : wallpaper.url;
  bg.src = nowImgUrl;
  setResolutionText();
}

function updateInfo() {
  if (!activeWallpaper) return;

  document.getElementById("title").innerText = activeWallpaper.title;
  document.getElementById("copyright").innerHTML =
    `<a href="${activeWallpaper.copyrightlink}" target="_blank">${activeWallpaper.copyright}</a>`;
}

bg.addEventListener("load", function () {
  if (bg.naturalWidth && bg.naturalHeight) {
    currentNaturalSize = `${bg.naturalWidth}×${bg.naturalHeight}`;
    resolutionEl.innerText = `当前图片：${currentNaturalSize}`;
  }
});

function renderHistory() {
  historyEl.innerHTML = "";
  const list = currentData.history || [];

  [currentData.current, ...list].forEach((wallpaper, index) => {
    if (!wallpaper) return;

    const item = document.createElement("div");
    item.className = "history-item";
    item.title = wallpaper.title;

    const img = document.createElement("img");
    img.src = wallpaper.thumbnail || wallpaper.url;
    img.alt = wallpaper.title;
    img.loading = "lazy";

    item.appendChild(img);
    item.addEventListener("click", () => {
      setImage(wallpaper);
      updateInfo();
      document.querySelectorAll(".history-item").forEach(el => el.classList.remove("active"));
      item.classList.add("active");
    });

    historyEl.appendChild(item);

    if (index === 0) item.classList.add("active");
  });
}

async function loadData() {
  const res = await fetch("./bing.json", { cache: "no-store" });
  currentData = await res.json();

  if (currentData.error) {
    resolutionEl.innerText = currentData.error;
    return;
  }

  setImage(currentData.current);
  updateInfo();
  renderHistory();

  bg.onerror = () => {
    if (isHD) {
      isHD = false;
      toggleBtn.innerText = "切换高清原图";
      nowImgUrl = activeWallpaper.url;
      bg.src = nowImgUrl;
      setResolutionText();
    }
  };
}

toggleBtn.addEventListener("click", function () {
  if (!activeWallpaper) return;

  isHD = !isHD;

  if (isHD) {
    const hdUrl = activeWallpaper.url_uhd || activeWallpaper.url_4k;
    this.innerText = "切换普通画质";
    nowImgUrl = hdUrl;
    bg.src = hdUrl;

    bg.onerror = () => {
      isHD = false;
      this.innerText = "切换高清原图";
      nowImgUrl = activeWallpaper.url;
      bg.src = activeWallpaper.url;
      setResolutionText();
      alert("这张图没有开放高清原图，已回退普通画质");
    };
  } else {
    this.innerText = "切换高清原图";
    nowImgUrl = activeWallpaper.url;
    bg.src = activeWallpaper.url;
    bg.onerror = null;
  }

  setResolutionText();
});

document.getElementById("downloadBtn").addEventListener("click", async () => {
  if (!nowImgUrl || !activeWallpaper) return;

  const name = activeWallpaper.title.replace(/[\/\\:*?"<>|]/g, "_");
  const resStr = currentNaturalSize || activeWallpaper.resolution || "";
  const saveName = `必应壁纸_${name}_${resStr}.jpg`;

  try {
    const resp = await fetch(nowImgUrl, {
      mode: "cors",
      cache: "no-store"
    });

    if (!resp.ok) throw new Error("图片读取失败");

    const blob = await resp.blob();
    const objectUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = saveName;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(objectUrl);
  } catch (e) {
    window.open(nowImgUrl, "_blank", "noopener");
    alert("当前环境不能直接保存文件，请在新打开的图片页面右键另存为");
  }
});

loadData().catch(e => console.error("加载失败", e));
</script>
</body>
</html>
