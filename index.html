<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bing 每日壁纸</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
#bg{
  width:100%;
  height:100%;
  object-fit:cover;
}
.info{
  position:fixed;
  bottom:20px;
  left:20px;
  color:#fff;
  background:rgba(0,0,0,0.45);
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  max-width:calc(100% - 240px);
}
.info a{
  color:#8cf;
  text-decoration:none;
}
.btn-group{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  gap:10px;
}
button{
  color:#fff;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.3);
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}
button:hover{
  background:rgba(0,0,0,0.75);
}
</style>
</head>
<body>
<img id="bg" alt="Bing Wallpaper">

<div class="info">
  <div id="title"></div>
  <div id="copyright"></div>
  <div id="resolution" style="margin-top:6px;font-size:12px;color:#ccc"></div>
  <div style="margin-top:6px;font-size:12px;color:#ccc">
    图片来源 Bing，版权归原作者所有，仅作技术演示，请勿商用
  </div>
</div>

<div class="btn-group">
  <button id="toggle4k">切换普通画质</button>
  <button id="downloadBtn">下载图片</button>
</div>

<script>
let currentData = null;
let isHD = true;
let nowImgUrl = "";
let currentNaturalSize = "";

const bg = document.getElementById("bg");
const resolutionEl = document.getElementById("resolution");
const toggleBtn = document.getElementById("toggle4k");

function setResolutionText() {
  if (!currentData) return;

  if (isHD) {
    resolutionEl.innerText = "当前画质：高清原图 UHD";
  } else {
    resolutionEl.innerText =
      `当前尺寸：${currentData.resolution || "1920×1080"}`;
  }
}

function setImage(url) {
  nowImgUrl = url;
  currentNaturalSize = "";
  bg.src = url;
  setResolutionText();
}

bg.addEventListener("load", function () {
  if (bg.naturalWidth && bg.naturalHeight) {
    currentNaturalSize = `${bg.naturalWidth}×${bg.naturalHeight}`;
    resolutionEl.innerText = `当前图片：${currentNaturalSize}`;
  }
});

async function loadData() {
  const res = await fetch("./bing.json", { cache: "no-store" });
  currentData = await res.json();

  document.getElementById("title").innerText = currentData.title;
  document.getElementById("copyright").innerHTML =
    `<a href="${currentData.copyrightlink}" target="_blank">${currentData.copyright}</a>`;

  const hdUrl = currentData.url_uhd || currentData.url_4k;

  if (hdUrl) {
    isHD = true;
    toggleBtn.innerText = "切换普通画质";
    setImage(hdUrl);

    bg.onerror = () => {
      isHD = false;
      toggleBtn.innerText = "切换高清原图";
      setImage(currentData.url);
      alert("这张图没有开放高清原图，已回退普通画质");
    };
  } else {
    isHD = false;
    toggleBtn.style.display = "none";
    setImage(currentData.url);
  }
}

toggleBtn.addEventListener("click", function () {
  if (!currentData) return;

  isHD = !isHD;

  if (isHD) {
    const hdUrl = currentData.url_uhd || currentData.url_4k;
    this.innerText = "切换普通画质";
    setImage(hdUrl);

    bg.onerror = () => {
      isHD = false;
      this.innerText = "切换高清原图";
      setImage(currentData.url);
      alert("这张图没有开放高清原图，已回退普通画质");
    };
  } else {
    this.innerText = "切换高清原图";
    setImage(currentData.url);
    bg.onerror = null;
  }
});

document.getElementById("downloadBtn").addEventListener("click", async () => {
  if (!nowImgUrl || !currentData) return;

  const name = currentData.title.replace(/[\/\\:*?"<>|]/g, "_");
  const resStr = currentNaturalSize || currentData.resolution || "";
  const saveName = `必应壁纸_${name}_${resStr}.jpg`;

  try {
    const resp = await fetch(nowImgUrl, {
      mode: "cors",
      cache: "no-store"
    });

    if (!resp.ok) throw new Error("图片读取失败");

    const blob = await resp.blob();
    const objectUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = saveName;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(objectUrl);
  } catch (e) {
    window.open(nowImgUrl, "_blank", "noopener");
    alert("当前环境不能直接保存文件，请在新打开的图片页面右键另存为");
  }
});

loadData().catch(e => console.error("加载失败", e));
</script>
</body>
</html>
