<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bing 每日壁纸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
#bg{
  width:100%;
  height:100%;
  object-fit:cover;
}
.info{
  position:fixed;
  bottom:20px;
  left:20px;
  color:#fff;
  background:rgba(0,0,0,0.45);
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  max-width:calc(100% - 40px);
}
.info a{
  color:#8cf;
  text-decoration:none;
}
</style>
</head>
<body>
<img id="bg" alt="Bing Wallpaper">
<div class="info">
  <div id="title"></div>
  <div id="copyright"></div>
  <div style="margin-top:6px;font-size:12px;color:#ccc">
    ⚠️ 图片来源 Bing，版权归原作者所有，仅作技术演示，请勿商用
  </div>
</div>
<script>
fetch("./bing.json")
.then(res => res.json())
.then(data => {
  document.getElementById("bg").src = data.url;
  document.getElementById("title").innerText = data.title;
  document.getElementById("copyright").innerHTML =
    `<a href="${data.copyrightlink}" target="_blank">${data.copyright}</a>`;

  if (data.resolution && data.resolution !== "") {
    const res = document.createElement("div");
    res.style.marginTop = "6px";
    res.style.fontSize = "12px";
    res.style.color = "#ccc";
    res.innerText = `分辨率：${data.resolution}`;
    document.querySelector(".info").appendChild(res);
  }
})
.catch(e => console.error("加载失败", e));
</script>
</body>
</html>
